<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Pomodoro Pill</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: transparent; }
  #wrap { position: absolute; inset: 0; padding: 8px; zoom: var(--scale, 1); width: 300px; height: 84px; }
  #pill {
    position: relative; width: 284px; height: 68px; border-radius: 34px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.10) inset;
    cursor: grab; transition: box-shadow .4s;
  }
  #pill.dragging { cursor: grabbing; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--shade), transparent 55%, var(--shade)); }
  .shade::after { content: ''; position: absolute; inset: 0; background: var(--shade); opacity: .55; }
  #content { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 12px 0 9px; gap: 10px; }

  #ring { position: relative; width: 50px; height: 50px; flex: none; border-radius: 50%; color: var(--text); }
  #ring svg.track { position: absolute; inset: 0; width: 50px; height: 50px; transform: rotate(-90deg); }
  #ring circle { fill: none; stroke-width: 4; }
  #ring .bg { stroke: rgba(255,255,255,.18); }
  .light #ring .bg { stroke: rgba(0,0,0,.12); }
  #ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke .6s; filter: drop-shadow(0 0 3px var(--accent)); }
  #ring .center { position: absolute; inset: 9px; border-radius: 50%; display: grid; place-items: center; font-size: 15px;
    background: rgba(0,0,0,.22); transition: background .2s, transform .15s; }
  .light #ring .center { background: rgba(255,255,255,.45); }
  #ring:hover .center { background: rgba(0,0,0,.36); transform: scale(1.06); }
  .light #ring:hover .center { background: rgba(255,255,255,.7); }
  #ring:active .center { transform: scale(.95); }

  #mid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1; }
  #time { font-family: var(--display); font-weight: 600; font-size: 30px; letter-spacing: .5px; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 8px rgba(0,0,0,.35); }
  .light #time { text-shadow: 0 1px 6px rgba(255,255,255,.6); }
  .light #sub { text-shadow: 0 0 6px rgba(255,255,255,.9); }
  #pill:hover #sub { -webkit-mask-image: linear-gradient(90deg, #000 35%, transparent 62%); }
  #sub { margin-top: 5px; font-size: 11.5px; color: var(--sub); text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 8px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  #sub b { color: var(--accent); font-weight: 600; }
  #taskInput { display: none; margin-top: 3px; width: 100%; font: 12px var(--ui); color: var(--text); background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 2px 6px; outline: none; user-select: text; }
  .light #taskInput { background: rgba(255,255,255,.7); border-color: rgba(0,0,0,.2); }
  .editing #sub { display: none; } .editing #taskInput { display: block; }

  #right { height: 100%; flex: none; display: flex; align-items: center; }
  #dots, #ctrls { display: flex; align-items: center; justify-content: flex-end; transition: opacity .2s, transform .2s; }
  #ctrls { position: absolute; right: 12px; top: 0; bottom: 0; }
  #dots { gap: 5px; }
  #dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .light #dots i { background: rgba(0,0,0,.15); }
  #dots i.on { background: var(--accent-work); box-shadow: 0 0 6px var(--accent-work); }
  #ctrls { gap: 2px; opacity: 0; transform: translateX(6px); pointer-events: none; }
  #pill:hover #ctrls { opacity: 1; transform: none; pointer-events: auto; }
  #pill:hover #dots { opacity: 0; }
  #ctrls button { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; color: var(--text); }
  #ctrls button:hover { background: rgba(255,255,255,.18); }
  .light #ctrls button:hover { background: rgba(0,0,0,.08); }

  #toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.95); padding: 6px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 600; background: rgba(0,0,0,.72); color: #fff; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 270px; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #ghost { position: absolute; right: 10px; top: 6px; font-size: 11px; color: var(--sub); opacity: 0; }
  .clickthrough #ghost { opacity: .9; }

  /* session-complete pulse */
  #pill.pulse { animation: pulse 1.2s ease-out 3; }
  @keyframes pulse {
    0% { box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 0 var(--accent); }
    100% { box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 14px transparent; }
  }
  .paused #time { opacity: .82; }
</style>
</head>
<body>
<div id="wrap">
  <div id="pill">
    <canvas id="scene"></canvas>
    <div class="shade"></div>
    <div id="content">
      <button id="ring" title="Start / pause">
        <svg class="track" viewBox="0 0 50 50"><circle class="bg" cx="25" cy="25" r="22"/><circle class="fg" id="arc" cx="25" cy="25" r="22"/></svg>
        <span class="center" id="playIcon"></span>
      </button>
      <div id="mid">
        <div id="time">25:00</div>
        <div id="sub" title="Click to set what you're working on"></div>
        <input id="taskInput" maxlength="80" placeholder="What are you working on?" list="recent" spellcheck="false">
        <datalist id="recent"></datalist>
      </div>
      <div id="right">
        <div id="dots"></div>
        <div id="ctrls">
          <button id="bSkip" title="Skip to next"></button>
          <button id="bFull" title="Full screen"></button>
          <button id="bMore" title="Menu"></button>
        </div>
      </div>
    </div>
    <div id="ghost" title="Click-through is on"></div>
    <div id="toast"></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="util.js"></script>
<script src="scene.js"></script>
<script src="pill.js"></script>
</body>
</html>
